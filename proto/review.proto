syntax = "proto3";

service ReviewService {
    rpc GetReviewsByProductID(Payload) returns (ReviewsResponse) {}
    rpc AddReview(Review) returns (ReviewResponse) {}
}

message Payload {
    int32 productId = 1;
}

message Review {
    int32 productId = 1;
    string username = 2;
    int32 rating = 3;
    string comment = 4;
    string date = 5;
}

message ReviewResponse {
    bool success = 1;
    string message = 2;
}

message ReviewsResponse {
    repeated Review reviews = 1;
}